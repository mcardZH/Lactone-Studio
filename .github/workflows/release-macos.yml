name: Build & Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：发布到指定 GitHub Release 标签（例如 v2.0.3-lactone.1，留空则仅生成 Actions 构建产物）'
        required: false
        default: ''
        type: string
      prerelease:
        description: '是否标记为 Pre-release（预发布版）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build & Package macOS (Apple Silicon arm64)
    runs-on: macos-15
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Miniforge (Conda-Forge Scientific Environment)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: 'latest'
          activate-environment: lactone-studio
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install Python 3.12 Scientific Stack & GNU xTB
        run: |
          conda install -y -n lactone-studio -c conda-forge \
            python=3.12 \
            numpy \
            scipy \
            rdkit \
            ase \
            spglib \
            tblite \
            tblite-python \
            threadpoolctl \
            xtb=6.4.1

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Stage macOS native Python & xTB runtime into .local
        run: |
          CONDA_ENV_PATH="$(conda info --base)/envs/lactone-studio"
          echo "Staging macOS native runtime from: ${CONDA_ENV_PATH}"
          node scripts/native/stage-darwin-runtime.mjs \
            --conda-prefix "${CONDA_ENV_PATH}" \
            --platform darwin-arm64 \
            --update-locks

      - name: Prepare desktop assets & 3Dmol patches
        run: npm run prepare:runtime

      - name: Build & Package Lactone Studio (.app + .dmg + 安装说明)
        run: npm run package:mac

      - name: Archive .app bundle & compute SHA-256 checksums
        id: artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          OUT_DIR="release/darwin-arm64"
          APP_ZIP="${OUT_DIR}/Lactone-Studio-${VERSION}-darwin-arm64.app.zip"
          DMG_FILE="${OUT_DIR}/Lactone-Studio-${VERSION}-darwin-arm64.dmg"
          INSTALL_GUIDE="${OUT_DIR}/安装说明 (INSTALL).txt"
          CHECKSUM_FILE="${OUT_DIR}/SHA256SUMS.txt"

          ditto -c -k --sequesterRsrc --keepParent \
            "${OUT_DIR}/Lactone Studio.app" \
            "${APP_ZIP}"

          (
            cd "${OUT_DIR}"
            shasum -a 256 \
              "$(basename "${DMG_FILE}")" \
              "$(basename "${APP_ZIP}")" \
              "$(basename "${INSTALL_GUIDE}")" > "SHA256SUMS.txt"
          )

          cat "${CHECKSUM_FILE}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=${DMG_FILE}" >> "$GITHUB_OUTPUT"
          echo "zip_path=${APP_ZIP}" >> "$GITHUB_OUTPUT"
          echo "guide_path=${INSTALL_GUIDE}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${CHECKSUM_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS Release Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Lactone-Studio-${{ steps.artifacts.outputs.version }}-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.artifacts.outputs.dmg_path }}
            ${{ steps.artifacts.outputs.zip_path }}
            ${{ steps.artifacts.outputs.guide_path }}
            ${{ steps.artifacts.outputs.checksum_path }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: Lactone Studio ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }} (macOS 非官方修改版)
          body_path: ${{ steps.artifacts.outputs.guide_path }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.dmg_path }}
            ${{ steps.artifacts.outputs.zip_path }}
            ${{ steps.artifacts.outputs.guide_path }}
            ${{ steps.artifacts.outputs.checksum_path }}
