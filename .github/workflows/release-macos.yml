name: Build & Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：发布到指定 GitHub Release 标签（例如 v2.0.3-lactone.1，留空则仅生成 Actions 构建产物）'
        required: false
        default: ''
        type: string
      target_arch:
        description: '目标 Mac 芯片架构（arm64 = Apple Silicon M1/M2/M3/M4；x64 = Intel）'
        required: false
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x64
      runner:
        description: 'GitHub Actions 运行器（默认 macos-15-intel 免排队秒级启动并支持交叉打包 arm64/x64）'
        required: false
        default: 'macos-15-intel'
        type: choice
        options:
          - macos-15-intel
          - macos-26-intel
          - macos-latest
          - macos-26
      prerelease:
        description: '是否标记为 Pre-release（预发布版）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS (${{ inputs.target_arch || 'arm64' }})
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    env:
      TARGET_ARCH: ${{ inputs.target_arch || 'arm64' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies & target-arch Electron.app
        run: |
          npm ci --ignore-scripts
          rm -rf node_modules/electron/dist node_modules/electron/path.txt
          ELECTRON_INSTALL_PLATFORM=darwin \
          ELECTRON_INSTALL_ARCH="${TARGET_ARCH}" \
          force_no_cache=true \
          node node_modules/electron/install.js

      - name: Install Python 3.12 Scientific Stack & GNU xTB via Micromamba
        run: |
          HOST_MACHINE="$(uname -m)"
          if [ "${HOST_MACHINE}" = "arm64" ]; then
            MAMBA_HOST_PLATFORM="osx-arm64"
          else
            MAMBA_HOST_PLATFORM="osx-64"
          fi
          if [ "${TARGET_ARCH}" = "arm64" ]; then
            CONDA_TARGET_PLATFORM="osx-arm64"
          else
            CONDA_TARGET_PLATFORM="osx-64"
          fi
          mkdir -p "${RUNNER_TEMP}/mamba"
          curl -Ls "https://micro.mamba.pm/api/micromamba/${MAMBA_HOST_PLATFORM}/latest" | tar -xvj -C "${RUNNER_TEMP}/mamba" bin/micromamba
          CONDA_ENV_PATH="${HOME}/lactone-studio-conda-runtime-env"
          rm -rf "${CONDA_ENV_PATH}"
          "${RUNNER_TEMP}/mamba/bin/micromamba" create -y -p "${CONDA_ENV_PATH}" \
            --platform "${CONDA_TARGET_PLATFORM}" \
            -c conda-forge --channel-priority strict \
            python=3.12 \
            numpy \
            scipy \
            rdkit \
            ase \
            spglib \
            tblite \
            tblite-python \
            threadpoolctl \
            xtb=6.4.1

      - name: Stage macOS native Python & xTB runtime into .local
        run: |
          CONDA_ENV_PATH="${HOME}/lactone-studio-conda-runtime-env"
          echo "Staging darwin-${TARGET_ARCH} native runtime from: ${CONDA_ENV_PATH}"
          node scripts/native/stage-darwin-runtime.mjs \
            --conda-prefix "${CONDA_ENV_PATH}" \
            --platform "darwin-${TARGET_ARCH}" \
            --update-locks

      - name: Prepare desktop assets & build frontend bundle
        run: |
          npm run prepare:runtime
          npm run build

      - name: Package Lactone Studio (.app + .dmg + 安装说明)
        run: |
          node scripts/release/package-macos.mjs --skip-build --arch "${TARGET_ARCH}"

      - name: Archive .app bundle & compute SHA-256 checksums
        id: artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          OUT_DIR="release/darwin-${TARGET_ARCH}"
          APP_ZIP="${OUT_DIR}/Lactone-Studio-${VERSION}-darwin-${TARGET_ARCH}.app.zip"
          DMG_FILE="${OUT_DIR}/Lactone-Studio-${VERSION}-darwin-${TARGET_ARCH}.dmg"
          INSTALL_GUIDE="${OUT_DIR}/安装说明 (INSTALL).txt"
          CHECKSUM_FILE="${OUT_DIR}/SHA256SUMS.txt"

          ditto -c -k --sequesterRsrc --keepParent \
            "${OUT_DIR}/Lactone Studio.app" \
            "${APP_ZIP}"

          (
            cd "${OUT_DIR}"
            shasum -a 256 \
              "$(basename "${DMG_FILE}")" \
              "$(basename "${APP_ZIP}")" \
              "$(basename "${INSTALL_GUIDE}")" > "SHA256SUMS.txt"
          )

          cat "${CHECKSUM_FILE}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=${DMG_FILE}" >> "$GITHUB_OUTPUT"
          echo "zip_path=${APP_ZIP}" >> "$GITHUB_OUTPUT"
          echo "guide_path=${INSTALL_GUIDE}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${CHECKSUM_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS Release Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Lactone-Studio-${{ steps.artifacts.outputs.version }}-macos-${{ env.TARGET_ARCH }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.artifacts.outputs.dmg_path }}
            ${{ steps.artifacts.outputs.zip_path }}
            ${{ steps.artifacts.outputs.guide_path }}
            ${{ steps.artifacts.outputs.checksum_path }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: Lactone Studio ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }} (macOS 非官方修改版)
          body_path: ${{ steps.artifacts.outputs.guide_path }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.dmg_path }}
            ${{ steps.artifacts.outputs.zip_path }}
            ${{ steps.artifacts.outputs.guide_path }}
            ${{ steps.artifacts.outputs.checksum_path }}
